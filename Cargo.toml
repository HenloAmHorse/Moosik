[package]
name = "moosik"
version = "1.6.0"
edition = "2024"

[[bin]]
name = "moosik"
path = "src/main.rs"

[features]
default = ["asio-dsd", "alsa-dsd"]
# Native DSD output through ASIO drivers (Windows x86_64 only) — the route to
# bit-perfect DSD512, which exceeds DoP's carrier-rate ceiling. Talks COM
# directly to third-party ASIO drivers; no Steinberg SDK needed, the interface
# is declared by hand (x64-only, where the ASIO thiscall ABI quirk doesn't
# exist). Gated to `cfg(windows)` everywhere it's used, so this is a no-op on
# Linux/macOS regardless of this default. On Windows, defaulting it on just
# surfaces "Native DSD (ASIO)" in the 🔈 menu — actually using it still
# requires picking a specific driver by hand, so it stays inert until a user
# opts in. Disable with `--no-default-features` if you want a build with no
# ASIO/COM code at all.
asio-dsd = []
# Native DSD output through ALSA (Linux only) — the same idea over the kernel's
# DSD_U32_BE/U16/U8 formats on a direct hw: device. cpal already links libasound
# into every Linux build, so this adds no system dependency; gated to
# `cfg(target_os = "linux")` everywhere it's used, a no-op elsewhere. Like the
# ASIO path, inert until a user picks a device in the 🔈 menu.
alsa-dsd = ["dep:alsa"]
# Round 12-E diagnostics: counts the requested-output FFT leaf calls so a
# test run on its own can show which leaf path it reached. Off by default;
# never in an ordinary or timed build.
leaf-diagnostics = ["rustfft/moosik-diagnostics"]

[dependencies]
eframe = { version = "=0.31.1", features = ["default", "moosik_windows_linked_viewport", "moosik_child_accesskit"] }
egui = "0.31"
rodio = { version = "0.20", features = ["symphonia-all"] }
lofty = "0.22"
rfd = "0.15"
rustfft = "6"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Simplified/Traditional display conversion of lyric translations: a pure
# Rust OpenCC with its dictionaries compiled in (Apache-2.0, as are OpenCC's
# dictionaries). Only the two character-set directions; no Japanese tables.
ferrous-opencc = { version = "=0.4.0", default-features = false, features = ["s2t-conversion", "t2s-conversion"] }
rtrb = "0.3.4"
lz4_flex = "0.11"
symphonia = { version = "=0.5.5", features = ["flac", "mp3", "vorbis", "isomp4", "aac", "alac", "aiff", "caf", "moosik-opus"] }
cpal = "0.15"
# OS media-key / now-playing integration (MPRIS, SMTC, macOS MediaPlayer).
# use_zbus = pure-Rust D-Bus on Linux, so no system libdbus-1-dev needed.
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
miniz_oxide = "0.8"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
# GPU compute for the superlet pre-process. wgpu is already in the tree via
# eframe, so this only declares it directly; it runs on Vulkan and Metal, so
# AMD, Intel and Apple are covered as well as NVIDIA.
#
# default-features would pull in the DX12 backend, whose `gpu-allocator`
# dependency wants a different `windows` crate version than this tree already
# resolves — the two cannot coexist. Vulkan covers every Windows GPU that could
# run this work anyway, and a machine with neither simply falls back to the CPU
# path, which is mandatory regardless.
wgpu = { version = "24", default-features = false, features = ["wgsl", "wgc", "metal"] }
pollster = "0.4"
bytemuck = "1"
lindera = { version = "6", default-features = false, features = ["embed-ipadic"] }
# SHA-256 for the analysis cache's persistent identity (spectrum/store.rs).
# Already in the tree and compiled into every build through ureq's rustls; the
# exact locked version, without default features, adds no package.
ring = { version = "=0.17.14", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# alsa-dsd: direct hw: access for native DSD (cpal already pulls this crate in
# on Linux, so it costs nothing new — this just makes it a direct dependency).
alsa = { version = "0.9", optional = true }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
wasapi = "0.23.0"
# timeBeginPeriod — raise the system timer resolution so the frame limiter's
# thread::sleep is accurate enough for high-refresh displays.
# Win32_Graphics_Gdi — EnumDisplaySettingsW, to default Max FPS to the monitor's
# refresh rate.
# Win32_System_Threading — MMCSS ("Pro Audio"), so the render thread keeps its
# deadline while the superlet pre-process has every other core busy.
windows-sys = { version = "0.59", features = [
    "Win32_Media", "Win32_Graphics_Gdi", "Win32_System_Threading",
    # Win32_Graphics_Dwm — DwmFlush, to line frames up with the display's refresh.
    "Win32_Graphics_Dwm",
    # asio-dsd: driver discovery (registry) + COM instantiation + a desktop
    # HWND for drivers that refuse a null init handle.
    "Win32_System_Registry", "Win32_System_Com", "Win32_System_Ole", "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # GetLocalTime — the shell's logo knows when it is the middle of the night.
    "Win32_System_SystemInformation",
    # AllocConsole / AttachConsole — the "Debug console window" setting.
    "Win32_System_Console",
] }
# Extract the HWND from eframe for SMTC media controls (souvlaki needs it).
raw-window-handle = "0.6"
# asio-dsd: registry driver discovery + COM instantiation for ASIO.
# (Feature-gating optional deps per-target isn't expressive enough in Cargo,
# so the extra windows-sys features ride along unconditionally on Windows —
# they only add API declarations, not linked code.)

# eframe 0.31.1's minimized-window sleep throttles a visible immediate child
# viewport whose pass belongs to the minimized parent — the spectrum window.
# The vendored copy is the exact published archive plus one Windows-only,
# opt-in policy; see vendor/eframe-0.31.1/PATCH.md.
[patch.crates-io]
rodio = { path = "vendor/rodio-0.20.1" }
symphonia = { path = "vendor/symphonia-0.5.5" }
symphonia-format-mkv = { path = "vendor/symphonia-format-mkv-0.5.5" }
symphonia-format-ogg = { path = "vendor/symphonia-format-ogg-0.5.5" }
eframe = { path = "vendor/eframe-0.31.1" }
# rustfft 6.4.1 plus the requested-output (pruned) inverse entry points and
# live-row column passes the production ASLT inverse uses (R10-R13); see
# vendor/rustfft-6.4.1/PATCH.md.
rustfft = { path = "vendor/rustfft-6.4.1" }
# egui 0.31.1 flushes the shared text-layout cache at the start of every
# viewport's pass, including an immediate child's pass nested inside its
# parent's, which evicts everything the frame has not yet re-used. The vendored
# copy is the exact published archive plus a once-per-frame flush for nested
# passes; see vendor/egui-0.31.1/PATCH.md.
egui = { path = "vendor/egui-0.31.1" }

[profile.release]
opt-level = 3
lto = "thin"          # cross-crate inlining — faster decode + FFT
codegen-units = 1     # single unit lets LLVM optimise across all code
panic = "abort"       # no unwinding overhead
