[package]
name = "cqt-speed-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rustfft = { path = "../../../vendor/rustfft-6.4.1" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Match the application's ordinary release configuration.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

