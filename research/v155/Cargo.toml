[package]
name = "moosik-cqt-research"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "cqt-probe"
path = "cqt_probe.rs"

[[bin]]
name = "rt-fft-probe"
path = "rt_fft_probe.rs"
required-features = ["fft-screen"]

[features]
default = ["fft-screen"]
fft-screen = ["dep:rustfft"]

[dependencies]
rustfft = { path = "../../vendor/rustfft-6.4.1", optional = true }
